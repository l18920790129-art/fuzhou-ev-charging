# Render Blueprint 配置
# 用于自动化部署福州充电桩智能选址平台
services:
  - type: web
    name: fuzhou-ev-charging
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn fuzhou_ev_charging.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fuzhou-ev-db
          property: connectionString

databases:
  - name: fuzhou-ev-db
    plan: free
